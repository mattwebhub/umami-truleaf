name: Create docker images

on:
  push:
    branches:
      - feat/truleaf-moderation
    tags:
      - "v*.*.*"

concurrency:
  group: immutable-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate fork
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      SKIP_DB_CHECK: 1
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-db
      - run: pnpm check:truleaf
      - run: pnpm test
      - run: pnpm exec tsc --noEmit

  build:
    name: Build and push immutable image
    needs: validate
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      cache: true
      cache-mode: max
      cache-scope: umami-truleaf
      sbom: true
      sign: true
      meta-images: ghcr.io/${{ github.repository }}
      # Registry tags are discovery pointers, not release identities. Production
      # deployments must consume the verified digest returned by this job.
      meta-tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=sha,format=long,prefix=sha-
      set-meta-labels: true
      set-meta-annotations: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify-image:
    name: Verify immutable image evidence
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: umami_runtime
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d umami_runtime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate build outputs
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_SIGNED: ${{ needs.build.outputs.signed }}
          VERIFY_COMMANDS: ${{ needs.build.outputs.cosign-verify-commands }}
        run: |
          [[ "$IMAGE_SIGNED" == "true" ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "$VERIFY_COMMANDS" ]]

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: ${{ needs.build.outputs.cosign-version }}

      - name: Log into GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Verify signatures, provenance, and SBOM
        env:
          VERIFY_COMMANDS: ${{ needs.build.outputs.cosign-verify-commands }}
        run: |
          while IFS= read -r verify_line; do
            [[ "$verify_line" == "cosign verify"* ]]
            read -r -a verify_args <<< "$verify_line"
            [[ "${verify_args[0]}" == "cosign" ]]
            "${verify_args[@]}"
          done <<< "$VERIFY_COMMANDS"

      - name: Verify manifest platforms
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          manifest_json="$(
            docker buildx imagetools inspect --raw "$IMAGE_NAME@$IMAGE_DIGEST"
          )"
          jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' <<< "$manifest_json"

      - name: Smoke-test runtime startup and migrations
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          container_id="$(
            docker run --detach --network host \
              --env APP_SECRET=truleaf-runtime-smoke-secret \
              --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/umami_runtime \
              "$IMAGE_NAME@$IMAGE_DIGEST"
          )"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/heartbeat >/dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]]; then
              echo "Runtime container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done

          echo "Runtime container did not become healthy within 60 seconds"
          exit 1

      - name: Record release evidence
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          {
            echo "### Immutable image"
            echo
            echo "\`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo
            echo "- Native platforms: linux/amd64, linux/arm64"
            echo "- Cosign signatures and attestations: verified"
            echo "- SBOM: generated and signed"
          } >> "$GITHUB_STEP_SUMMARY"
