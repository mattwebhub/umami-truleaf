name: Create docker images

on:
  push:
    branches:
      - feat/truleaf-moderation
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional image version (e.g. 3.0.0, v3.0.0, or 3.0.0-beta.1)"
        required: false
        default: ""

jobs:
  validate:
    name: Validate fork
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      SKIP_DB_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-db
      - run: pnpm check:truleaf
      - run: pnpm test
      - run: pnpm exec tsc --noEmit

  build:
    name: Build and push immutable image
    needs: validate
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      cache: true
      cache-mode: max
      cache-scope: umami-truleaf
      sbom: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        type=sha,format=long,prefix=sha-
      set-meta-labels: true
      set-meta-annotations: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
