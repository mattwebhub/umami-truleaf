name: Create docker images

on:
  push:
    branches:
      - feat/truleaf-moderation
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional image version (e.g. 3.0.0, v3.0.0, or 3.0.0-beta.1)"
        required: false
        default: ""

jobs:
  validate:
    name: Validate fork
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      SKIP_DB_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-db
      - run: pnpm check:truleaf
      - run: pnpm test
      - run: pnpm exec tsc --noEmit

  build:
    name: Build and push immutable image
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: compute
        run: |
          INPUT="${{ github.event.inputs.version }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          REF_TAG="${REF_NAME//\//-}"

          # Determine version source
          if [[ -n "$INPUT" ]]; then
            VERSION="${INPUT#v}"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=""
          fi

          GHCR_TAGS=""
          SHA_TAG="ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA}"

          if [[ -n "$VERSION" ]]; then
            GHCR_TAGS="ghcr.io/${{ github.repository }}:$VERSION,$SHA_TAG"
          else
            # Feature-branch build: immutable SHA plus a convenient moving branch tag.
            GHCR_TAGS="ghcr.io/${{ github.repository }}:${REF_TAG},$SHA_TAG"
          fi

          echo "ghcr_tags=$GHCR_TAGS" >> $GITHUB_OUTPUT
          echo "Computed GHCR tags: $GHCR_TAGS"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.compute.outputs.ghcr_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
