name: Node.js CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Upstream 3.2.0 has pre-existing full-tree Biome findings; keep the
      # fork integration itself as a strict formatting and lint gate.
      - run: pnpm check:truleaf
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
